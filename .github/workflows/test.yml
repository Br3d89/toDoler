# The exhaustive run: every pull request and every push to master goes through
# `pnpm check`, the same command a developer runs by hand. If this job is green
# the change typechecks, lints, builds, and passes every spec in the repo.
name: Check

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # typecheck (app, specs, tooling), lint, production build, the app specs
      # under jsdom, then the tooling specs under Node. One script, five stages,
      # and the first one to fail stops the job.
      - name: Check
        run: pnpm run check
